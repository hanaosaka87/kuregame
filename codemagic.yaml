workflows:
  ios-release:
    name: クレゲー iOS リリースビルド
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: hana_apple_api
    environment:
      groups:
        # Codemagicの環境変数グループ「app_store_credentials」に以下を登録すること：
        # APP_STORE_CONNECT_ISSUER_ID / APP_STORE_CONNECT_KEY_IDENTIFIER / APP_STORE_CONNECT_PRIVATE_KEY
        # CERTIFICATE_PRIVATE_KEY（配布用証明書の秘密鍵）
        - app_store_credentials
      vars:
        BUNDLE_ID: "biz.trickster.hana.cranegame.app"
        APP_STORE_APP_ID: "6829718126"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: lts
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: npm install
        script: npm install
      - name: Capacitor sync（Webアセットをネイティブプロジェクトへ反映）
        script: npx cap sync ios
      - name: ビルド番号を自動インクリメント（App Store Connectの最新値+1）
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: 署名用キーチェーンを初期化
        script: keychain initialize
      - name: 配布用証明書・プロビジョニングプロファイルを自動取得
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: 証明書をキーチェーンに追加
        script: keychain add-certificates
      - name: Xcodeの自動署名を設定
        script: |
          xcode-project use-profiles
      - name: IPAをビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 本番公開まで自動化する場合はsubmit_to_app_storeもtrueにし審査提出まで自動化できるが、
        # 最初はTestFlight配信のみに留め、動作確認後に手動でApp Store提出する運用を推奨
